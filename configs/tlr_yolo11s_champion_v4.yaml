# TLR-YOLO-MTL Production Champion v4 Model Configuration
# Synthesized & Ratified per Tickets E47-E52 (Phase 5 & Phase 6 Integration)
# Integrates:
# - E38: Scale-Matched Paired Augmentation (Scale-Matched Zoom + Paired Copy-Paste)
# - E39: Physics-Grounded Photometric Traffic Light Augmentation (Gaussian Bloom + Strict Hue)
# - E40: DySample Dynamic Upsampling (P3 -> P2 lateral neck path)
# - E41: Task-Specific Gated Feature Fusion & 5x5 ROIAlign on State Head
# - E42: Geometry-Aware Cross-Attention with 14D Spatial Bias & Confidence Gating
# - E43: Counterfactual Hard-Negative Mining for Ego-Lane Relevance
# - E44: Long-Tail Class-Balanced Focal Softmax State Loss
# - E45: Size-Adaptive Gaussian NWD Post-Processing Policy
# - E46: Static Multi-Task Loss Balancing
# - E48: Local-View Tiny-TL High-Resolution Crop Distillation (64x64)
# - E49: Sparse Candidate Refinement Head on Top-32 Tiny Sub-Grid Regions (7x7 ROIAlign)
# - E50: NWD-Quality-Aware Confidence Head & Tiny-Aligned Ranking
# - E51: Scale-Aware C2 -> P2 Feature Relay for Raw Texture Recovery (tlr_yolo11s_p2_relay.yaml)
# - E52: Multi-Frame Temporal Sequence Teacher Distillation for Single-Frame Inference

seed: 42
records: datasets/tlr_mtl_dtld_paired/records.jsonl
model_variant: yolo11s
model_config: configs/model/tlr_yolo11s_p2_relay.yaml
warmstart_weights: yolo11s.pt
input_size: [960, 1920]  # [height, width] High-resolution champion (+44.0% pixel density, E34 validated)
device: cuda
amp: true
amp_initial_scale: 32.0
workers: 4               # Optimized DataLoader workers
prefetch_factor: 2       # Double-buffer prefetch
micro_batch_size: 4      # Optimized throughput micro-batch for RTX 5070 12GB (Peak VRAM: 9.1GB)
effective_batch_size: 32 # Standardized effective batch size
gradient_accumulation_steps: 8  # 4 * 8 = 32 effective batch
optimizer_steps_per_epoch: 100  # 3,200 sampled images / epoch
gradient_clip_norm: 10.0
weight_decay: 0.01
ema_decay: 0.9999
checkpoint_every: 10
val_steps_per_epoch: 25
p2_enabled: true         # 4 pyramid levels [4, 8, 16, 32] (P2-P5)
horizontal_flip: false
training_sources: [DTLD]
require_paired: true

# Phase 5 & Phase 6 Data Augmentation & Sampling Policy (E38 + E39 + E32)
augmentation:
  zoom_enabled: true
  zoom_prob: 0.50
  zoom_scale_min: 1.20
  zoom_scale_max: 2.00
  scale_matched_enabled: true             # E38: Distribution-aware scale-matched zoom
  scale_matched_quotas: [0.40, 0.35, 0.25] # [sub-8px, 8-16px, >16px]
  paired_copy_paste_enabled: true        # E38: Context-preserving paired copy-paste
  paired_copy_paste_prob: 0.30
  hard_sampling_enabled: true            # E32: Tri-tier hard mining
  hard_sampling_weights: [0.50, 0.30, 0.20]  # [tiny/distractor, directional, standard]
  photometric_bloom_enabled: true        # E39: Physics-grounded lamp bloom & glare
  photometric_bloom_prob: 0.50
  strict_hue_preservation: true          # E39: Strictly bound hue shifts (|hsv_h| <= 0.004)

architecture:
  token_dim: 128
  token_feature_dim: 64
  attention_heads: 4
  max_traffic_lights: 32     # Locked candidate pool K_TL = 32 (E12)
  max_arrows: 32             # Locked candidate pool K_Arrow = 32 (E12)
  traffic_score_threshold: 0.01
  arrow_score_threshold: 0.05
  ego_lane_enabled: false

  # E40 Component: DySample Dynamic Upsampling in P3 -> P2 lateral neck path
  dysample_upsampling:
    enabled: true
    groups: 4
    lateral_path: "p3_to_p2"

  # E51 Component: Scale-Aware C2 -> P2 Feature Relay
  scale_aware_relay:
    enabled: true
    gating_type: "spatial_channel"
    c2_channels: 64
    p2_channels: 64
    hidden_ratio: 0.5
    residual_scale: 1.0

  # E41 Component: Task-Specific Gated Fusion & 5x5 State Head ROIAlign
  roialign_attributes:
    enabled: true
    roi_size: [3, 3]         # Default 3x3 for round/maneuver heads
    state_roi_size: [5, 5]   # Expanded 5x5 for state head (E41)
    embed_dim: 128
    stride_p2: 4.0
    stride_p3: 8.0

  task_gated_fusion:
    enabled: true            # E41: Learnable task-specific alpha_t gating
    hidden_dim: 64
    tasks: ["state", "round", "maneuver", "relevance"]

  # C3 Component: Query-Conditioned Road Arrow Selection (E33 Pareto champion: M=8)
  arrow_retrieval:
    enabled: true
    top_m: 8
    hidden_dim: 64

  # E42 Component: Geometry-Aware Cross-Attention with 14D Relative Spatial Bias & Confidence Gating
  geometry_attention:
    enabled: true
    embed_dim: 128
    heads: 4
    hidden_dim: 64
    use_confidence_gate: true
    relative_bias_dim: 14

  # E43 Component: Counterfactual Hard-Negative Collation for Ego-Lane Relevance
  counterfactual_sampling:
    enabled: true
    quota_ratios: [0.40, 0.30, 0.15, 0.15]  # [pos, easy_neg, cross_lane, spatial_mast]

  # C5 Component: Unconstrained Per-Query Adaptive Contextual Gate (E23b validated)
  adaptive_gate:
    enabled: true
    hidden_dim: 64
    enforce_round_fallback: false

  # E49 Component: Sparse Candidate Refinement Head (Top-32 proposals, area < 256 px^2)
  sparse_refinement:
    enabled: true
    max_candidates: 32
    area_threshold: 256.0
    roi_size: [7, 7]
    hidden_dim: 64

  # E50 Component: NWD-Quality-Aware Confidence Head
  quality_head:
    enabled: true
    alpha: 0.70
    area_threshold: 64.0
    nwd_constant: 12.0
    hidden_dim: 64

tal_assigner:
  type: nwd_aware_tal        # Scale-adaptive NWD-aware TAL Assigner (E30 causally isolated)
  lambda_nwd: 0.5
  tiny_transition_area: 64.0
  nwd_constant: 12.0
  mode: scale_adaptive

source_quotas_per_effective_batch:
  DTLD: 32

loss_weights:                # E46 + E48 + E49 + E50 + E52: Cumulative Pareto optimal multi-task loss weights
  detection: 1.0
  state: 0.75
  round: 0.5
  maneuver: 1.0
  ego_lane: 0.0
  relevance: 1.0
  nwd: 0.5
  association: 0.0           # Contrastive/association loss formally rejected in E35
  contrastive: 0.0
  distillation: 0.50         # E48: Local-View HR Crop KD
  quality: 0.50              # E50: NWD-Quality BCE Loss
  refinement: 0.50           # E49: Sparse Candidate Refinement Loss
  temporal_distillation: 0.50 # E52: Temporal Sequence Teacher Distillation

# E48 Component: Local-View Tiny-TL High-Resolution Crop Distillation Configuration
distillation:
  enabled: true
  crop_size: [64, 64]
  crop_margin: 0.15
  max_area_threshold: 256.0  # sub-16px traffic lights (<256 px^2)
  feature_weight: 0.5
  state_weight: 0.5
  temperature: 3.0
  feature_loss_type: "mse"
  teacher_supervised: true

# E52 Component: Temporal Sequence Teacher Distillation Configuration
temporal_distillation:
  enabled: true
  window_size: 3
  feature_weight: 0.5
  state_weight: 0.5
  flicker_weight: 0.25
  temperature: 3.0
  feature_loss_type: "mse"
  teacher_supervised: true

loss:
  state_loss_type: "class_balanced_focal_softmax"  # E44: Class-Balanced Focal Softmax
  class_balanced_beta: 0.9999
  balanced_softmax_priors: [0.390, 0.044, 0.482, 0.085]  # [Red, Yellow, Green, Off] DTLD priors
  attribute_focal_gamma: 1.5
  maneuver_focal_gamma: 2.0
  ego_lane_focal_gamma: 2.0
  relevance_focal_gamma: 2.0
  nwd_constant: 12.0
  quality_gamma: 1.5         # E50: Quality Focal BCE gamma
  quality_area_threshold: 64.0

# E45 & E50 Component: Size-Adaptive Gaussian NWD Post-Processing Policy with Quality Ranking
postprocessing:
  size_adaptive_nms: true
  nwd_area_threshold: 64.0
  nwd_tau: 0.50
  nwd_constant: 12.0
  standard_iou_tau: 0.45
  quality_ranking: true      # E50: Joint Quality-Aware Ranking (s = p^0.7 * q^0.3)
  quality_alpha: 0.70

# E37 Standardized Evaluation vs Deployment Protocol
evaluation_contract:
  eval_conf_threshold: 0.001
  deploy_conf_threshold: 0.25
  deploy_iou_threshold: 0.45
  primary_dataset: "DTLD"
  validation_images: 5962

phases:
  - name: joint_training_single_phase
    epochs: 50
    freeze_backbone: false
    freeze_neck: false
    freeze_perception: false
    context_enabled: true
    relevance_perception_gradient_scale: 0.0
    relevance_perception_gradient_scale_end: 1.0
    backbone_lr: 0.0001
    head_lr: 0.001
    freeze_batchnorm: false
