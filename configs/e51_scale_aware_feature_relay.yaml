# TLR-YOLO-MTL Configuration: Ticket E51 (Scale-Aware C2 -> P2 Feature Relay for Raw Texture Recovery)
# Extends Champion v3 (+ E48 Distillation + E49 Sparse Refinement + E50 NWD Quality Head) with C2->P2 Scale-Aware Feature Relay

seed: 42
records: datasets/tlr_mtl_dtld_paired/records.jsonl
model_variant: yolo11s
model_config: configs/model/tlr_yolo11s_p2_relay.yaml
warmstart_weights: yolo11s.pt
input_size: [960, 1920]  # [height, width] High-resolution champion
device: cuda
amp: true
amp_initial_scale: 32.0
workers: 4
prefetch_factor: 2
micro_batch_size: 4
effective_batch_size: 32
gradient_accumulation_steps: 8
optimizer_steps_per_epoch: 100
gradient_clip_norm: 10.0
weight_decay: 0.01
ema_decay: 0.9999
checkpoint_every: 10
val_steps_per_epoch: 25
p2_enabled: true
horizontal_flip: false
training_sources: [DTLD]
require_paired: true

# Phase 5 & Phase 6 Data Augmentation & Sampling Policy
augmentation:
  zoom_enabled: true
  zoom_prob: 0.50
  zoom_scale_min: 1.20
  zoom_scale_max: 2.00
  scale_matched_enabled: true             # E38
  scale_matched_quotas: [0.40, 0.35, 0.25]
  paired_copy_paste_enabled: true        # E38
  paired_copy_paste_prob: 0.30
  hard_sampling_enabled: true            # E32
  hard_sampling_weights: [0.50, 0.30, 0.20]
  photometric_bloom_enabled: true        # E39
  photometric_bloom_prob: 0.50
  strict_hue_preservation: true          # E39

architecture:
  token_dim: 128
  token_feature_dim: 64
  attention_heads: 4
  max_traffic_lights: 32     # Locked candidate pool K_TL = 32
  max_arrows: 32             # Locked candidate pool K_Arrow = 32
  traffic_score_threshold: 0.01
  arrow_score_threshold: 0.05
  ego_lane_enabled: false

  # E40 Component: DySample Dynamic Upsampling
  dysample_upsampling:
    enabled: true
    groups: 4
    lateral_path: "p3_to_p2"

  # E51 Component: Scale-Aware C2 -> P2 Feature Relay
  scale_aware_relay:
    enabled: true
    gating_type: "spatial_channel"
    c2_channels: 64
    p2_channels: 64
    hidden_ratio: 0.5
    residual_scale: 1.0

  # E41 Component: Task-Specific Gated Fusion & 5x5 State Head ROIAlign
  roialign_attributes:
    enabled: true
    roi_size: [3, 3]
    state_roi_size: [5, 5]
    embed_dim: 128
    stride_p2: 4.0
    stride_p3: 8.0

  task_gated_fusion:
    enabled: true
    hidden_dim: 64
    tasks: ["state", "round", "maneuver", "relevance"]

  # E33 Component: Query-Conditioned Road Arrow Selection
  arrow_retrieval:
    enabled: true
    top_m: 8
    hidden_dim: 64

  # E42 Component: Geometry-Aware Cross-Attention
  geometry_attention:
    enabled: true
    embed_dim: 128
    heads: 4
    hidden_dim: 64
    use_confidence_gate: true
    relative_bias_dim: 14

  # E43 Component: Counterfactual Hard-Negative Collation
  counterfactual_sampling:
    enabled: true
    quota_ratios: [0.40, 0.30, 0.15, 0.15]

  # E49 Component: Sparse Candidate Refinement Head (Top-32 proposals)
  sparse_refinement:
    enabled: true
    max_candidates: 32
    area_threshold: 256.0
    roi_size: [7, 7]
    hidden_dim: 64
    loss_weight_box: 1.0
    loss_weight_state: 0.5

  # E50 Component: NWD-Quality-Aware Confidence Head & Ranking
  nwd_quality_head:
    enabled: true
    alpha: 0.70
    area_threshold: 64.0
    nwd_constant: 12.0
    loss_weight: 0.50
    quality_gamma: 1.5
    hidden_dim: 64

# E44 & E46 Multi-Task Loss Weighting
loss_weights:
  det: 1.00
  box_ciou: 0.50
  box_nwd: 0.75
  state: 0.50
  relevance: 1.00
  arrow: 1.00
  refinement: 0.50
  quality: 0.50

state_loss:
  type: "class_balanced_focal"
  beta: 0.999
  gamma: 1.5
  class_weights: [0.70, 2.00, 0.90, 2.50]  # [Green, Yellow, Red, Off]
  temperature: 1.0

# E45 Standard Size-Adaptive NWD Post-Processing Policy
postprocess:
  conf_eval: 0.001
  conf_deploy: 0.25
  iou_threshold: 0.45
  size_adaptive_nwd:
    enabled: true
    area_threshold: 64.0
    nwd_tau: 0.50
    nwd_c: 12.0
    iou_fallback: 0.45
