# Ultralytics YOLOv8 with P2/4 head — scale 'n' pinned.
# Verbatim copy of ultralytics/cfg/models/v8/yolov8-p2.yaml (AGPL-3.0). We keep
# the `scales:` block because Ultralytics reads max_channels from THERE, not from
# the top level. The filename stem 'yolov8n-p2' makes the parser select scale 'n'.
# Result: YOLO("configs/model/yolov8n-p2.yaml") -> ~3.0M params (v8 nano + P2 head).
#
# Unlike YOLO26 (where P2 is the special head added to the base config), YOLOv8
# has an OFFICIAL P2 variant. Used here as a cross-architecture baseline against
# YOLO26n-P2: same P2/4 head concept, different backbone (C2f vs C3k2).
#
# INIT WEIGHTS: only COCO (yolov8n.pt) is available for v8 — Objects365 weights
# do NOT exist for this family. COCO includes "traffic light" as class 9, so the
# transfer still seeds a TL-aware backbone.
#
# Paper: Ultralytics YOLOv8, https://docs.ultralytics.com/models/yolov8

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]   # <- selected by the 'n' in the filename
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0-p2 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 3, C2f, [128]] # 18 (P2/4-xsmall)  <-- the P2 head

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]] # cat head P3
  - [-1, 3, C2f, [256]] # 21 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 24 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f, [1024]] # 27 (P5/32-large)

  - [[18, 21, 24, 27], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
