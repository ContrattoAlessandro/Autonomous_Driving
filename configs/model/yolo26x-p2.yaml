# Ultralytics YOLO26 with P2/4 head — scale 'x' pinned.
# Verbatim copy of ultralytics/cfg/models/26/yolo26-p2.yaml (AGPL-3.0). We keep
# the `scales:` block because Ultralytics reads max_channels from THERE, not from
# the top level — removing it inflates the model ~1.83x (106M vs 57.9M).
# The filename stem 'yolo26x-p2' makes the parser select scale 'x'.
# Result: YOLO("configs/model/yolo26x-p2.yaml") -> 57.9M params, 257.4 GFLOPs.
#
# Paper: Ultralytics YOLO26, arXiv 2606.03748.

# nc is overridden at train time by the data.yaml of the chosen tier (A/B/C).
nc: 80
end2end: True   # NMS-free one-to-one head (YOLO26 default)
reg_max: 1      # DFL-free regression

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]   # <- selected by the 'x' in the filename

# YOLO26 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]  # 9
  - [-1, 2, C2PSA, [1024]]            # 10

# YOLO26 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]        # cat backbone P4
  - [-1, 2, C3k2, [512, True]]       # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]        # cat backbone P3
  - [-1, 2, C3k2, [256, True]]       # 16 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]        # cat backbone P2
  - [-1, 2, C3k2, [128, True]]       # 19 (P2/4-xsmall)  <-- the P2 head

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]       # cat head P3
  - [-1, 2, C3k2, [256, True]]       # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]       # cat head P4
  - [-1, 2, C3k2, [512, True]]       # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]       # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]]  # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]]    # Detect(P2, P3, P4, P5)
