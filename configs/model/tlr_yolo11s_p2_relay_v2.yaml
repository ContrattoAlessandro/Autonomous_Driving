# TLR-YOLO-MTL backbone: unified two-type YOLO11s P2-P5 detector with DySample and Scale-Conditioned C2->P2 Feature Relay v2 (Ticket E66).
# 1. DySample dynamic point-sampling upsampler operates on the lateral P3 -> P2 pathway (layer 17).
# 2. Scale-Conditioned Feature Relay v2 selectively injects raw shallow C2 texture into P2 via dual-gate mechanism:
#    G_eff = alpha_normal + gamma_tiny * (1 - alpha_normal)
# The filename contains yolo11s, so Ultralytics selects the small scale.

nc: 2  # [traffic_light, road_arrow]
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]         # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]        # 1-P2/4
  - [-1, 2, C3k2, [256, false, 0.25]] # 2 (C2)
  - [-1, 1, Conv, [256, 3, 2]]        # 3-P3/8
  - [-1, 2, C3k2, [512, false, 0.25]] # 4 (C3)
  - [-1, 1, Conv, [512, 3, 2]]        # 5-P4/16
  - [-1, 2, C3k2, [512, true]]        # 6 (C4)
  - [-1, 1, Conv, [1024, 3, 2]]       # 7-P5/32
  - [-1, 2, C3k2, [1024, true]]       # 8 (C5)
  - [-1, 1, SPPF, [1024, 5]]          # 9
  - [-1, 2, C2PSA, [1024]]            # 10

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]  # 11 (stride 16)
  - [[-1, 6], 1, Concat, [1]]                 # 12 cat backbone C4
  - [-1, 2, C3k2, [512, false]]               # 13

  - [-1, 1, nn.Upsample, [null, 2, nearest]]  # 14 (stride 8)
  - [[-1, 4], 1, Concat, [1]]                 # 15 cat backbone C3
  - [-1, 2, C3k2, [256, false]]               # 16

  - [-1, 1, DySample, [2, lp, 4]]             # 17 (stride 4) DySample Point-Sampling Dynamic Upsampler
  - [[-1, 2], 1, Concat, [1]]                 # 18 cat backbone C2
  - [-1, 2, C3k2, [128, false]]               # 19 (P2/4-raw)

  # Scale-Conditioned C2 -> P2 Feature Relay v2 (Ticket E66)
  - [[2, -1], 1, ScaleAwareFeatureRelayV2, [64, 64, dual_gate]] # 20 (P2/4-refined)

  - [-1, 1, Conv, [128, 3, 2]]                # 21 (stride 8)
  - [[-1, 16], 1, Concat, [1]]                # 22 cat head P3
  - [-1, 2, C3k2, [256, false]]               # 23 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                # 24 (stride 16)
  - [[-1, 13], 1, Concat, [1]]                # 25 cat head P4
  - [-1, 2, C3k2, [512, false]]               # 26 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                # 27 (stride 32)
  - [[-1, 10], 1, Concat, [1]]                # 28 cat head P5
  - [-1, 2, C3k2, [1024, true]]               # 29 (P5/32-large)

  - [[20, 23, 26, 29], 1, Detect, [nc]]       # 30 Detect(P2_refined, P3, P4, P5)
