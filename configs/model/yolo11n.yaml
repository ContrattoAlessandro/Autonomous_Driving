# Ultralytics YOLO11 (NO P2 head) — scale 'n' pinned.
# Verbatim copy of ultralytics/cfg/models/11/yolo11.yaml (AGPL-3.0). We keep
# the `scales:` block because Ultralytics reads max_channels from THERE, not from
# the top level. The filename stem 'yolo11n' makes the parser select scale 'n'.
# Result: YOLO("configs/model/yolo11n.yaml") -> ~2.62M params (v11 nano, no P2).
#
# YOLO11 has NO official P2 variant — the head outputs only P3/P4/P5 (same
# output strides as yolov8n.yaml). Used as the third cross-architecture baseline
# (C2f for v8 vs C3k2+C2PSA for v11) against YOLOv8n and YOLO26n, all no-P2.
#
# INIT WEIGHTS: only COCO (yolo11n.pt) is available for v11 — Objects365 weights
# do NOT exist for this family. COCO includes "traffic light" as class 9, so the
# transfer still seeds a TL-aware backbone.
#
# Paper: Ultralytics YOLO11, https://docs.ultralytics.com/models/yolo11

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]   # <- selected by the 'n' in the filename
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]         # 9
  - [-1, 2, C2PSA, [1024]]           # 10

# YOLO11n head (NO P2/4 head — outputs P3/P4/P5 only)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]        # cat backbone P4
  - [-1, 2, C3k2, [512, False]]      # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]        # cat backbone P3
  - [-1, 2, C3k2, [256, False]]      # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]       # cat head P4
  - [-1, 2, C3k2, [512, False]]      # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]       # cat head P5
  - [-1, 2, C3k2, [1024, True]]      # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]  # Detect(P3, P4, P5)
