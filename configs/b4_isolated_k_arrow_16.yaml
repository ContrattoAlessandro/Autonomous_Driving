# Run B4-Isolated Configuration: P2 Stride-4 Neck + NWD-Aware TaskAlignedAssigner + Isolated K_Arrow=16
# Evaluates the isolated causal contribution of NWD-TAL matching against Run B2 (K_Arrow=16) and Run B4 (K_Arrow=32).
seed: 42
records: datasets/tlr_mtl_dtld_paired/records.jsonl
model_variant: yolo11s
model_config: configs/model/tlr_yolo11s_p2.yaml
warmstart_weights: yolo11s.pt
input_size: [800, 1600]  # [height, width]
device: cuda
amp: true
amp_initial_scale: 32.0
workers: 2
prefetch_factor: 1
micro_batch_size: 4
effective_batch_size: 32
gradient_accumulation_steps: 8
optimizer_steps_per_epoch: 100
gradient_clip_norm: 10.0
weight_decay: 0.01
ema_decay: 0.9999
checkpoint_every: 10
val_steps_per_epoch: 25
p2_enabled: true         # 4 pyramid levels [4, 8, 16, 32] (P2-P5)
horizontal_flip: false
training_sources: [DTLD]
require_paired: true

architecture:
  token_dim: 128
  token_feature_dim: 64
  attention_heads: 4
  max_traffic_lights: 32
  max_arrows: 16             # Pure assigner isolation: K_Arrow=16 (matching Run B2)
  traffic_score_threshold: 0.01
  arrow_score_threshold: 0.05
  ego_lane_enabled: false

tal_assigner:
  type: nwd_aware_tal        # Scale-adaptive NWD-aware TAL Assigner
  lambda_nwd: 0.5
  tiny_transition_area: 64.0
  nwd_constant: 12.0
  mode: scale_adaptive

source_quotas_per_effective_batch:
  DTLD: 32

loss_weights:
  detection: 1.0
  state: 0.75
  round: 0.5
  maneuver: 1.0
  ego_lane: 0.5
  relevance: 1.0
  nwd: 0.5
  association: 0.0

loss:
  attribute_focal_gamma: 1.5
  maneuver_focal_gamma: 2.0
  ego_lane_focal_gamma: 2.0
  relevance_focal_gamma: 2.0
  nwd_constant: 12.0

phases:
  - name: joint_training_single_phase
    epochs: 130
    freeze_backbone: false
    freeze_neck: false
    freeze_perception: false
    context_enabled: true
    relevance_perception_gradient_scale: 0.0
    relevance_perception_gradient_scale_end: 1.0
    backbone_lr: 0.0001
    head_lr: 0.001
    freeze_batchnorm: false
