# Tier C — PICTOGRAM ablation (DTLD only).
# This is where the P2 head's fine spatial discrimination is most visible.
# DTLD is the only public dataset with full pictogram annotations at scale.
#
# Class list is provisional; scripts/harmonize_labels.py will write the final
# nc/names after scanning the DTLD labels (rare pictograms may be merged).

path: ./datasets/yolo/tierC     # DTLD-only
train: train.txt
val: val.txt
test: test.txt

nc: 9
names:
  0: red
  1: yellow
  2: green
  3: red_yellow
  4: "off"
  5: arrow_left
  6: arrow_straight
  7: arrow_right
  8: pedestrian
