# ATLAS Traffic Light Dataset (Polley et al. 2025, FZI).
# Native ATLAS taxonomy: 25 pictogram-state classes, including off,
# red-yellow and directional arrows.  IDs and names must match
# dataset_ATLAS/ATLAS/ATLAS_classes.yaml exactly.
# The converter writes train/val/test lists without rewriting labels.
# Paper: Polley et al. 2025 — The ATLAS of Traffic Lights.
# Home: https://url.fzi.de/ATLAS

path: ./datasets/yolo/atlas
train: train.txt
val: val.txt        # temporal/guarded subset of native train from convert_atlas.py
test: test.txt

nc: 25
names:
  0: circle_green
  1: circle_red
  2: "off"
  3: circle_red_yellow
  4: arrow_left_green
  5: circle_yellow
  6: arrow_right_red
  7: arrow_left_red
  8: arrow_straight_red
  9: arrow_left_red_yellow
  10: arrow_left_yellow
  11: arrow_straight_yellow
  12: arrow_right_red_yellow
  13: arrow_right_green
  14: arrow_right_yellow
  15: arrow_straight_green
  16: arrow_straight_left_green
  17: arrow_straight_red_yellow
  18: arrow_straight_left_red
  19: arrow_straight_left_yellow
  20: arrow_straight_left_red_yellow
  21: arrow_straight_right_red
  22: arrow_straight_right_red_yellow
  23: arrow_straight_right_yellow
  24: arrow_straight_right_green
