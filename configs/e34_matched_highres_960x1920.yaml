# TLR-YOLO-MTL Matched High-Resolution (960x1920) Training Configuration
# Validated per Ticket E34: Matched Retraining Audit under Unified Evaluation Contract (E29 Standard)
seed: 42
records: datasets/tlr_mtl_dtld_paired/records.jsonl
model_variant: yolo11s
model_config: configs/model/tlr_yolo11s_p2.yaml
warmstart_weights: yolo11s.pt
input_size: [960, 1920]  # [height, width] High-resolution regime (+44.0% pixel density)
device: cuda
amp: true
amp_initial_scale: 32.0
workers: 2               # Windows multiprocess limit
prefetch_factor: 1       # Bounds host-RAM usage
micro_batch_size: 2      # Memory-safe micro-batch for 960x1920 + P2 on 12GB VRAM
effective_batch_size: 32 # Strictly matched to baseline B4 effective batch size
gradient_accumulation_steps: 16  # 2 * 16 = 32 effective batch
optimizer_steps_per_epoch: 100  # Matched: 3,200 sampled images / epoch
gradient_clip_norm: 10.0
weight_decay: 0.01
ema_decay: 0.9999
checkpoint_every: 10
val_steps_per_epoch: 25
p2_enabled: true         # 4 pyramid levels [4, 8, 16, 32] (P2-P5)
horizontal_flip: false
training_sources: [DTLD]
require_paired: true

architecture:
  token_dim: 128
  token_feature_dim: 64
  attention_heads: 4
  max_traffic_lights: 32
  max_arrows: 32             # Matched K_Arrow=32
  traffic_score_threshold: 0.01
  arrow_score_threshold: 0.05
  ego_lane_enabled: false

tal_assigner:
  type: nwd_aware_tal        # Matched scale-adaptive NWD-aware TAL Assigner
  lambda_nwd: 0.5
  tiny_transition_area: 64.0
  nwd_constant: 12.0
  mode: scale_adaptive

source_quotas_per_effective_batch:
  DTLD: 32

loss_weights:
  detection: 1.0
  state: 0.75
  round: 0.5
  maneuver: 1.0
  ego_lane: 0.5
  relevance: 1.0
  nwd: 0.5
  association: 0.0

loss:
  attribute_focal_gamma: 1.5
  maneuver_focal_gamma: 2.0
  ego_lane_focal_gamma: 2.0
  relevance_focal_gamma: 2.0
  nwd_constant: 12.0

phases:
  - name: joint_training_single_phase
    epochs: 130
    freeze_backbone: false
    freeze_neck: false
    freeze_perception: false
    context_enabled: true
    relevance_perception_gradient_scale: 0.0
    relevance_perception_gradient_scale_end: 1.0
    backbone_lr: 0.0001
    head_lr: 0.001
    freeze_batchnorm: false
