# Run E31 Configuration: Multi-Scale ROIAlign End-to-End Integration & Downstream Safety Validation
# Candidate-centered 3x3 Multi-Scale ROIAlign over P2 (stride 4) and P3 (stride 8) feature maps.
seed: 42
records: datasets/tlr_mtl_dtld_paired/records.jsonl
model_variant: yolo11n
model_config: configs/model/tlr_yolo11n_p2.yaml
warmstart_weights: yolo11n.pt
input_size: [800, 1600]  # [height, width]
device: cuda
amp: true
amp_initial_scale: 32.0
workers: 2
prefetch_factor: 1
micro_batch_size: 8
effective_batch_size: 32
gradient_accumulation_steps: 4
optimizer_steps_per_epoch: 100
gradient_clip_norm: 10.0
weight_decay: 0.01
ema_decay: 0.9999
checkpoint_every: 10
val_steps_per_epoch: 25
p2_enabled: true
horizontal_flip: false
training_sources: [DTLD]
require_paired: true

architecture:
  token_dim: 128
  token_feature_dim: 64
  attention_heads: 4
  max_traffic_lights: 32
  max_arrows: 32
  traffic_score_threshold: 0.01
  arrow_score_threshold: 0.05
  ego_lane_enabled: false

candidate_attribute_extractor:
  type: multiscale_roialign
  levels: [P2, P3]
  roi_output_size: [3, 3]
  sampling_ratio: 2
  spatial_strides: [4, 8]
  fusion_layer:
    in_channels: 256  # 128 (P2: 64ch * 3x3 -> 128) + 128 (P3: 128ch * 3x3 -> 128)
    out_channels: 128
    type: conv2d_1x1_layernorm_silu

  heads:
    state_head:
      type: mlp
      hidden_dims: [128, 64]
      num_classes: 4  # [Red, Yellow, Green, Off]
    round_head:
      type: mlp
      hidden_dims: [128, 64]
      num_classes: 2
    maneuver_head:
      type: mlp
      hidden_dims: [128, 64]
      num_classes: 3  # [Left, Straight, Right]

tal_assigner:
  type: nwd
  nwd_weight: 0.5
  nwd_constant: 12.0
  area_threshold: 64.0
  mode: scale_adaptive

loss_weights:
  detection: 1.0
  state: 0.75
  round: 0.5
  maneuver: 1.0
  ego_lane: 0.5
  relevance: 1.0
  nwd: 0.5
  association: 0.0

loss:
  attribute_focal_gamma: 1.5
  maneuver_focal_gamma: 2.0
  ego_lane_focal_gamma: 2.0
  relevance_focal_gamma: 2.0
  nwd_constant: 12.0
