# TLR-YOLO-MTL Configuration: Ticket E50 (NWD-Quality-Aware Confidence Head & Tiny-Aligned Ranking)
# Extends Champion v3 (+ E48 Distillation + E49 Sparse Refinement) with joint NWD-quality ranking

seed: 42
records: datasets/tlr_mtl_dtld_paired/records.jsonl
model_variant: yolo11s
model_config: configs/model/tlr_yolo11s_p2.yaml
warmstart_weights: yolo11s.pt
input_size: [960, 1920]  # [height, width] High-resolution champion
device: cuda
amp: true
amp_initial_scale: 32.0
workers: 4
prefetch_factor: 2
micro_batch_size: 4
effective_batch_size: 32
gradient_accumulation_steps: 8
optimizer_steps_per_epoch: 100
gradient_clip_norm: 10.0
weight_decay: 0.01
ema_decay: 0.9999
checkpoint_every: 10
val_steps_per_epoch: 25
p2_enabled: true
horizontal_flip: false
training_sources: [DTLD]
require_paired: true

# Phase 5 & Phase 6 Data Augmentation & Sampling Policy
augmentation:
  zoom_enabled: true
  zoom_prob: 0.50
  zoom_scale_min: 1.20
  zoom_scale_max: 2.00
  scale_matched_enabled: true             # E38
  scale_matched_quotas: [0.40, 0.35, 0.25]
  paired_copy_paste_enabled: true        # E38
  paired_copy_paste_prob: 0.30
  hard_sampling_enabled: true            # E32
  hard_sampling_weights: [0.50, 0.30, 0.20]
  photometric_bloom_enabled: true        # E39
  photometric_bloom_prob: 0.50
  strict_hue_preservation: true          # E39

architecture:
  token_dim: 128
  token_feature_dim: 64
  attention_heads: 4
  max_traffic_lights: 32     # Locked candidate pool K_TL = 32
  max_arrows: 32             # Locked candidate pool K_Arrow = 32
  traffic_score_threshold: 0.01
  arrow_score_threshold: 0.05
  ego_lane_enabled: false

  # E40 Component: DySample Dynamic Upsampling
  dysample_upsampling:
    enabled: true
    groups: 4
    lateral_path: "p3_to_p2"

  # E41 Component: Task-Specific Gated Fusion & 5x5 State Head ROIAlign
  roialign_attributes:
    enabled: true
    roi_size: [3, 3]
    state_roi_size: [5, 5]
    embed_dim: 128
    stride_p2: 4.0
    stride_p3: 8.0

  task_gated_fusion:
    enabled: true
    hidden_dim: 64
    tasks: ["state", "round", "maneuver", "relevance"]

  # E33 Component: Query-Conditioned Road Arrow Selection
  arrow_retrieval:
    enabled: true
    top_m: 8
    hidden_dim: 64

  # E42 Component: Geometry-Aware Cross-Attention
  geometry_attention:
    enabled: true
    embed_dim: 128
    heads: 4
    hidden_dim: 64
    use_confidence_gate: true
    relative_bias_dim: 14

  # E43 Component: Counterfactual Hard-Negative Collation
  counterfactual_sampling:
    enabled: true
    quota_ratios: [0.40, 0.30, 0.15, 0.15]

  # E49 Component: Sparse Candidate Refinement Head (Top-32 proposals)
  sparse_refinement:
    enabled: true
    max_candidates: 32
    area_threshold: 256.0
    roi_size: [7, 7]
    hidden_dim: 64

  # E50 Component: NWD-Quality-Aware Confidence Head
  quality_head:
    enabled: true
    alpha: 0.70
    area_threshold: 64.0
    nwd_constant: 12.0
    hidden_dim: 64

tal_assigner:
  type: nwd_aware_tal
  lambda_nwd: 0.5
  tiny_transition_area: 64.0
  nwd_constant: 12.0
  mode: scale_adaptive

source_quotas_per_effective_batch:
  DTLD: 32

loss_weights:
  detection: 1.0
  state: 0.75
  round: 0.5
  maneuver: 1.0
  ego_lane: 0.0
  relevance: 1.0
  nwd: 0.5
  association: 0.0
  contrastive: 0.0
  distillation: 0.5   # E48
  quality: 0.50       # E50

loss:
  state_loss_type: "class_balanced_focal_softmax"  # E44
  class_balanced_beta: 0.9999
  balanced_softmax_priors: [0.390, 0.044, 0.482, 0.085]
  attribute_focal_gamma: 1.5
  maneuver_focal_gamma: 2.0
  ego_lane_focal_gamma: 2.0
  relevance_focal_gamma: 2.0
  nwd_constant: 12.0
  quality_gamma: 1.5   # E50: Quality Focal BCE gamma
  quality_area_threshold: 64.0

# E45 & E50 Post-Processing Policy: Size-Adaptive NWD with Quality Ranking
postprocessing:
  size_adaptive_nms: true
  nwd_area_threshold: 64.0
  nwd_tau: 0.50
  nwd_constant: 12.0
  standard_iou_tau: 0.45
  quality_ranking: true
  quality_alpha: 0.70

evaluation_contract:
  eval_conf_threshold: 0.001
  deploy_conf_threshold: 0.25
  deploy_iou_threshold: 0.45
  primary_dataset: "DTLD"
  validation_images: 5962

phases:
  - name: joint_training_single_phase
    epochs: 50
    freeze_backbone: false
    freeze_neck: false
    freeze_perception: false
    context_enabled: true
    relevance_perception_gradient_scale: 0.0
    relevance_perception_gradient_scale_end: 1.0
    backbone_lr: 0.0001
    head_lr: 0.001
    freeze_batchnorm: false
